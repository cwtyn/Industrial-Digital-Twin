<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>输送布局编辑器 · 阶段A</title>
<style>
  :root{--bd:#c8c8c8;--ac:#1976D2;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Consolas,"Microsoft YaHei",monospace;display:flex;flex-direction:column;height:100vh;background:#f2f3f5}
  #bar{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#263238;color:#fff}
  #bar b{font-size:13px}
  .btn{background:#37474f;color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:12px}
  .btn:hover{background:#455a64}
  .btn.acc{background:var(--ac)}
  .btn.on{background:#2e7d32;outline:2px solid #81c784}
  #lineid{background:#fff;color:#222;border:1px solid var(--bd);padding:3px 6px;font-size:12px;width:70px}
  #main{flex:1;display:flex;min-height:0}
  #palette{width:118px;background:#fff;border-right:1px solid var(--bd);padding:8px;overflow:auto}
  #palette h4, #edges h4{font-size:12px;color:#555;margin-bottom:6px}
  .chip{display:flex;align-items:center;gap:5px;padding:3px 6px;margin:2px 0;border:1px solid var(--bd);
        border-radius:4px;cursor:grab;font-size:12px;background:#fafafa}
  .chip:hover{background:#e3f2fd}
  .sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
  .chip .txt{display:block;line-height:1.15;min-width:0}
  .chip b{display:block;font-size:12px;color:#333}
  #canvas{flex:1;position:relative;background:#fff;margin:10px;border:1px solid var(--bd);border-radius:6px;overflow:hidden}
  #world{position:absolute;left:0;top:0;background:#fff;transform-origin:0 0;cursor:grab} /* 可平移内容层 */
  .node{position:absolute;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;
        border:1.5px solid #222;border-radius:4px;cursor:move;user-select:none;z-index:3;text-align:center;line-height:1.1}
  .node.sel{outline:2px solid #ffd600}
  .node.link{outline:3px dashed #ffd600;box-shadow:0 0 0 1px #333;background:#000 !important}
  .tbar.hlsel{outline:2px solid #ffd600}                  /* 按位置高亮：点臂只亮这根臂，不连带本体(.1) */
  .tbar.hllink{outline:3px dashed #ffd600;background:#000 !important}
  .node.diamond{transform:rotate(45deg)}
  .node.circle{border-radius:50%}
  .node.dec{border-radius:2px}
  .node.dec .ttl{font-size:8px;line-height:1.05;padding:0 2px}
  .node .ttl{position:relative;z-index:2;padding:0 3px;border-radius:2px}
  .node .tarm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
              pointer-events:auto;cursor:move} /* TT 转角位容器：填满节点、绕中心旋转；可点选(事件冒泡到.node)，转过角度的臂也选得中 */
  .node .tbar{box-sizing:border-box;width:66px;height:22px;border:1.5px solid #222;border-radius:4px;
              display:flex;align-items:center;justify-content:center} /* 臂高=标准元素高(22), 与 RB/TT 一致 */
  .node .armlb{font-size:9px;color:#fff;padding:0 3px;white-space:nowrap;background:inherit;border-radius:2px}
  #edges{width:230px;background:#fff;border-left:1px solid var(--bd);padding:8px;overflow:auto}
  .edge{display:flex;gap:4px;align-items:center;font-size:11px;padding:3px 0;border-bottom:1px dashed #e0e0e0;cursor:pointer}
  .edge.sel{background:#fff3b0;outline:1px solid #ffd600}
  .edge .rm{border:none;background:#e53935;color:#fff;border-radius:3px;cursor:pointer;font-size:10px;padding:1px 5px}
  .mini{border:1px solid var(--bd);background:#fff;border-radius:3px;cursor:pointer;font-size:11px;padding:1px 6px;line-height:1}
  .mini:hover{background:#eceff1}
  .mini.rm2{border-color:#e53935;color:#e53935}
  select.bg{border:1px solid var(--bd);font-size:11px;background:#fff}
  #panel{display:none;position:fixed;right:12px;top:12px;bottom:12px;width:250px;background:rgba(255,255,255,.97);
         border:1px solid var(--bd);border-radius:6px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);z-index:6;font-size:12px;
         max-height:calc(100vh - 24px);overflow-y:auto}
  #panel h5{margin-bottom:8px;color:#333}
  #panel label{display:block;font-size:11px;color:#666;margin:6px 0 2px}
  #panel input,#panel select,#panel textarea{width:100%;border:1px solid var(--bd);border-radius:3px;padding:3px 5px;font-size:12px;font-family:inherit}
  #panel textarea{font-size:10px;resize:vertical}
  #exportwrap{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:20}
  #exportbox{background:#fff;border-radius:8px;padding:14px;width:680px;max-width:92vw;max-height:90vh;display:flex;flex-direction:column}
  #exportbox h4{margin-bottom:8px}
  #exportbox textarea{flex:1;min-height:340px;font-size:11px;font-family:Consolas,monospace;border:1px solid var(--bd);border-radius:4px;padding:8px}
  #exportbox .row{display:flex;gap:8px;margin-top:10px;justify-content:flex-end}
  .hint{font-size:11px;color:#888;margin-top:6px}
</style>
</head>
<body>
<div id="bar">
  <b>布局编辑器</b>
  <label style="font-size:12px">线号 <input id="lineid" value="Line_5" placeholder="Line_5" style="width:52px"></label>
  <select id="projSel" class="bg" style="height:24px"></select>
  <button class="btn" id="btnNew">＋ 新建线</button>
  <button class="btn acc" id="btnLink">🔗 连线模式</button>
  <button class="btn" id="btnS1" title="把当前线 spec 写到专属文件夹(FSA)">S1 导出spec</button>
  <button class="btn" id="btnS2" title="由当前线 spec 推导生成 deviceConfig 点位，写专属文件夹">S2 点位</button>
  <button class="btn" id="btnS3" title="校验当前线：id/边/CP/partner，红叉定位">S3 校验</button>
  <button class="btn" id="btnExport">导出弹窗(多线)</button>
  <button class="btn" id="btnImport">导入 JSON</button>
  <button class="btn acc" id="btnSave">💾 保存</button>
  <button class="btn" id="btnSample">载入示例</button>
  <button class="btn" id="btnClear">清空</button>
  <button class="btn" id="btnCenter" title="视图回到内容中心">↺ 复位视图</button>
  <span style="flex:1"></span>
  <span style="font-size:11px;opacity:.8">点调色板→画布放置 · 拖拽移动 · 空白拖拽=框选多选 · Ctrl+拖空白/滚轮=平移视口 · 连线模式：点两节点成边 · Delete删除 · 💾保存多线</span>
</div>
<div id="main">
  <div id="palette"></div>
  <div id="canvas">
    <div id="world">
      <svg id="links" style="position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none"></svg>
    </div>
    <div id="edgepanel" style="display:none;position:fixed;right:10px;top:10px;bottom:10px;width:220px;background:#fff;border:1px solid var(--bd);border-radius:6px;padding:10px;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,.18);max-height:calc(100vh - 20px);overflow-y:auto">
      <div style="font-weight:600;font-size:12px;margin-bottom:6px;color:#555">连线 <span id="epName"></span></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:8px">类型
        <select id="epEtri" style="flex:1"></select></div>
      <div style="display:flex;gap:6px">
        <button class="btn" id="epDelete" style="flex:1">🗑 删除</button>
        <button class="btn" id="epClear" title="清空全部连线">清空</button>
        <button class="btn acc" id="epClose">关闭</button>
      </div>
      <div class="hint">连线模式下点中画布连线=选中，可改类型/Delete删除。</div>
    </div>
    <div id="panel"></div>
  </div>
</div>
<div id="exportwrap"><div id="exportbox">
  <h4>导出线路规格（每条线一个 .json，文件名=线号.json）</h4>
  <div id="expSel" style="display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;margin-bottom:8px;font-size:12px;border:1px solid var(--bd);border-radius:4px;padding:6px 8px;background:#fafafa"></div>
  <div id="expErr"></div>
  <textarea id="specout" readonly></textarea>
  <div class="row">
    <button class="btn" id="btnCopy">复制当前线</button>
    <button class="btn acc" id="btnDl">下载所选（一线一文件）</button>
    <button class="btn" id="btnClose">关闭</button>
  </div>
</div></div>
<input type="file" id="filein" accept=".json,.txt" style="display:none">

<script>
// ---------- 调色板定义 ----------
const PAL = [
  ['RB','辊床(RB)','#E53935','','',null,'主线输送'],
  ['RB','过渡RB','#EF9A9A','','',{park:false,len:'1/2'},'过渡·不可停·长度可调'],
  ['LT','升降·工位(LT/RB)','#FB8C00','','',{pair:'RB'},'工位升降'],
  ['LT','升降·存位(LT/WT)','#BA68C8','','',{pair:'WT'},'存位升降'],
  ['TT','转台(TT)','#00897B','','',null,'转向 90/180'],
  ['SL','剪车(SL)','#039BE5','','',null,'剪式升降'],
  ['HE','提升机(HE)','#8D6E63','','',null,'跨层提升'],
  ['DEC','决策点(DEC)','#29B6F6','square','',null,'分道决策(Dest映射)'],
  ['CP','横移链(CP)','#E53935','ellipse','circle',null,'LT 间传送'],
  ['TC','横移车(TC)','#AB47BC','','diamond',null,'横向搬运'],
  ['EXT','跨线出口(EXT)','#616161','','',null,'跨线出'],
  ['ENT','跨线入口(ENT)','#515151','','',null,'跨线入'],
  ['WT','离线/上线','#BDBDBD','','',null,'车辆上下线(系统边界)']];
const ETRI = ['roller','load','cross','lift','tt','sl','tc','ext'];
const ISX = k => k==='EXT' || k==='ENT';           // 出入口统一按跨线接口处理

// ---------- 状态 ----------
// 节点ID = 线前缀 + '_' + 设备号; 线前缀可能含下划线(Line_5), 不能按 split('_') 拆。
function lineIdOf(id){ const m=/^(Line_\d+|Exit_\d+)/.exec(String(id||'')); return m?m[1]:''; }
function devLabelOf(id){ return String(id||'').replace(/^(?:Line_\d+|Exit_\d+)_/,''); }
const S = { line:'Line_5', elements:[], edges:[], selId:null, selEdge:null, linkMode:false, pan:{x:0,y:0},
            selPos:null, linkPos:null, selIds:[] };   // 选中位置（{id,arm}）：arm=null 本体(.1)，数字=转台臂；selIds=多选集合

const $ = id => document.getElementById(id);
const canvas = $('canvas'), world = $('world'), panel = $('panel');
panel.addEventListener('click', ev=> ev.stopPropagation());   // 面板内点击不落到画布：防控件重建后 target 游离而误关面板
panel.addEventListener('mousedown', ()=> panelSel=true);       // 记录拖动从面板开始：全选拖出面板也不关
document.addEventListener('mouseup', ()=> setTimeout(()=>panelSel=false, 0));
let panelSel=false;
let _panned=false, panMove=null;                     // 画布平移标志（拖空白平移视口）
let TTARMS=[];                                       // 本轮 TT 转角臂（{nodeId,el}）命中回退用

function nodeById(id){ return S.elements.find(e=>e.id===id); }
function edgeFrom(id){ return S.edges.filter(e=>e.from===id||e.to===id); }
// ---- 多位置设备 SL/HE/TC（一组位置节点 = 线内多台）----
const MULTI={SL:1,HE:1,TC:1};                                  // TT 除外：转台=单节点单中心，.N 是其转角位(扇臂)
const SPACING=60;                                            // 标准纵向间隔 px
function devBase(id){ const m=id.match(/^(.*)\.\d+$/); return m?m[1]:null; }
function devIdx(id){ const m=id.match(/\.(\d+)$/); return m?+m[1]:null; }
function devGroup(e){
  const b=devBase(e.id); if(!b || !MULTI[e.kind]) return [e];
  return S.elements.filter(x=>x.id.indexOf(b+'.')===0);
}
function uid(kind){
  const suf=kind||'RB';
  let n=(S.elements.length+1);
  // TT：每次新基=单节点（id=1A030TT，无 .N；转角位用 attrs.angles 表示）
  if(suf==='TT'){
    let base;
    while(nodeById(base=S.line+'_'+(n*5).toString().padStart(3,'0')+suf)) n++;
    return base;
  }
  if(MULTI[suf]){                                             // SL/HE/TC：每次新基(段号递增)从 .1 起
    while(true){ const b=S.line+'_'+(n*5).toString().padStart(3,'0')+suf;
      if(!nodeById(b+'.1')) return b+'.1'; n++; }
  }
  let id;
  while(nodeById(id=S.line+'_'+(n*5).toString().padStart(3,'0')+suf)) n++;
  return id;
}

// ---------- 调色板 ----------
function buildPalette(){
  $('palette').innerHTML = '<h4>元素<i style="font-style:normal;color:#aaa;font-size:10px;margin-left:4px">点按拖入画布</i></h4>';
  for(const [kind,name,color,shape,cls,init,desc] of PAL){
    const d=document.createElement('div'); d.className='chip'; d.title=(desc||name);
    const sp=document.createElement('span'); sp.className='sw'; sp.style.background=color;
    const box=document.createElement('span'); box.className='txt';
    const nm=document.createElement('b'); nm.textContent=name;   // 只显示名称，注释挪到 hover 提示
    box.append(nm);
    d.append(sp); d.append(box);
    d.onclick=()=>addNode(kind, undefined, undefined, init);
    $('palette').append(d);
  }
}
function addNode(kind, x, y, init){
  x = x ?? (-S.pan.x + canvas.clientWidth/2 + (Math.random()*40-20));   // 落在当前视口中心
  y = y ?? (-S.pan.y + canvas.clientHeight/2 + (Math.random()*40-20));
  const id = uid(kind);
  const attrs = {park:true, dir:'fwd'};
  if(kind==='CP') attrs.stops = [];
  if(kind==='TT'){ delete attrs.park; delete attrs.dir; attrs.angles = [180]; }  // 转台：单中心, 0°接收位 + 转角位
  if(kind==='DEC'){ delete attrs.park; delete attrs.dir;
    attrs.device=''; attrs.db=''; attrs.dest_map=[]; }   // 决策点：挂靠设备 + 决策DB + Dest映射
  if(init) Object.assign(attrs, init);   // 调色板 init 覆盖默认：LT 配位 pair / 过渡滚床 park:false+len
  S.elements.push({id, kind, label: devLabelOf(id), x, y, attrs, tag:{}});
  select(id); draw();
}
function removeEl(id){
  S.edges=S.edges.filter(ed=>ed.from!==id&&ed.to!==id);
  S.elements=S.elements.filter(x=>x.id!==id);
}
// 多位置设备：按位置数 n 物化/删减并纵向中心对齐（间隔 SPACING）
function applyPositions(base, kind, n){
  n=Math.max(1, Math.min(20, n|0));
  const prefix=base+'.';
  S.elements.filter(x=>x.id.indexOf(prefix)===0).forEach(x=>{ if(devIdx(x.id)>n) removeEl(x.id); });
  const proto=S.elements.filter(x=>x.id.indexOf(prefix)===0).map(x=>nodeById(x.id))[0];   // 原型物化：新位继承同类 attrs(如 TT 转角)
  for(let i=1;i<=n;i++){ const id=base+'.'+i; if(!nodeById(id))
    S.elements.push({id,kind,label:devLabelOf(id),x:0,y:0,
      attrs:proto&&proto.attrs?JSON.parse(JSON.stringify(proto.attrs)):{},tag:{}}); }
  const g=S.elements.filter(x=>x.id.indexOf(prefix)===0).map(x=>nodeById(x.id));
  const cx=g.reduce((a,x)=>a+x.x,0)/g.length;
  for(let i=1;i<=n;i++){ const x=nodeById(base+'.'+i);
    x.x=Math.round(cx); x.y=Math.round((g[0].y||0) + (i-(n+1)/2)*SPACING); }
  select(S.selId); renderEdges(); draw();
}
// CP：CP 为锚点在一端；传送流向恒为 stops[0]→stops[1]→…（索引序）。dir 只决定 CP 停哪端：
//   down: 顶=CP, 其下 stops[0..n-1]（车自上往下传）;  up: 底=CP, 其上 stops[n-1..0]（车自下往上传）。
// 虚线仅 CP→stops[0]（紧邻 CP 的站）。
function alignCPGroup(cp){
  const stops=(cp.attrs&&cp.attrs.stops)||[], n=stops.length; if(!n) return;
  const dir=(cp.attrs&&cp.attrs.dir)||'down', cx=cp.x;
  for(let i=0;i<n;i++){
    const lt=nodeById(stops[i]); if(!lt) continue;
    lt.x=cx;
    lt.y=Math.round(cp.y + (dir==='down' ? (i+1) : -(i+1))*SPACING); // down 向下铺, up 向上铺
  }
  renderEdges(); draw();
}
// ---------- 画布 ----------
function wOf(kind){ return 66; }                // 所有元素统一长度(与 TC 一致)
function hOf(kind){ return 22; }                // 统一高度：与 RB 一致(扁平)
const LENV={'1/4':0.25,'1/3':1/3,'1/2':0.5,'1/1':1};   // 过渡滚床长度分数
function nodeW(e){ const w=wOf(e.kind);                  // 过渡滚床(park:false)按 len 分数缩短长度，宽度不变
  if(e.kind==='RB'&&e.attrs&&e.attrs.park===false){ const f=LENV[(e.attrs&&e.attrs.len)||'1/2']||0.5; return w*f; }
  return w; }
const EDGE_COLOR = {roller:'#666',load:'#1976D2',cross:'#E53935',lift:'#9575CD',tt:'#00897B',sl:'#039BE5',tc:'#AB47BC',ext:'#424242'};
function drawEdges(){
  const NS='http://www.w3.org/2000/svg', svg=$('links');
  svg.innerHTML='';
  const defs=document.createElementNS(NS,'defs');
  const mk=document.createElementNS(NS,'marker'); mk.setAttribute('id','arr'); mk.setAttribute('markerWidth','7');
  mk.setAttribute('markerHeight','7'); mk.setAttribute('refX','6'); mk.setAttribute('refY','3'); mk.setAttribute('orient','auto'); mk.setAttribute('markerUnits','strokeWidth');
  const p=document.createElementNS(NS,'path'); p.setAttribute('d','M0,0 L0,6 L7,3 z'); p.setAttribute('fill','#333');
  mk.appendChild(p); defs.appendChild(mk); svg.appendChild(defs);
  function devBars(e){                       // 设备=一组杆件(含旋转臂)，每杆沿自身角度延伸
    const hl=wOf(e.kind)/2, hp=hOf(e.kind)/2;
    if(e.kind==='TT'){ const bs=[{theta:0,hl,hp}];
      for(const aa of ((e.attrs&&e.attrs.angles)||[])) if(isFinite(aa)) bs.push({theta:aa,hl,hp});
      return bs; }
    const turn=(e.attrs&&e.attrs.turn)||0;
    return [{theta:e.kind==='RB'?turn:0, hl, hp}];
  }
  function barExit(ux,uy,th,hl,hp){         // 射线enter方向(u)与绕th的矩形杆的交点距离（局域坐标）
    const c=Math.cos(-th*Math.PI/180), s=Math.sin(-th*Math.PI/180);
    const vx=ux*c-uy*s, vy=ux*s+uy*c;
    return Math.min(vx?hl/Math.abs(vx):Infinity, vy?hp/Math.abs(vy):Infinity);
  }
  function edgeOffset(e,ux,uy){             // 沿射线取所有杆(含旋转臂)的外侧出口，贴真实可见边
    let m=0; for(const b of devBars(e)){ const d=barExit(ux,uy,b.theta,b.hl,b.hp); if(d>m) m=d; }
    return m;
  }
  function edgeEnd(a,b){
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy); if(!len) return null;
    const ux=dx/len, uy=dy/len;
    // 按方向求线与设备(含旋转臂)真实外缘的交点距离：横连半宽、竖连半高、斜连先触边，旋转设备按旋转后的杆算
    const tA=edgeOffset(a,ux,uy);
    const tB=edgeOffset(b,ux,uy);
    return {x1:a.x+ux*tA, y1:a.y+uy*tA, x2:b.x-ux*tB, y2:b.y-uy*tB};
  }
  for(const e of S.edges){
    const a=nodeById(e.from), b=nodeById(e.to); if(!a||!b) continue;   // 端点不存在(导入脏spec)则跳过
    const ep=edgeEnd(a,b); if(!ep) continue;
    const isSel=(S.linkMode && e===S.selEdge);              // 仅连线模式可选中连线
    if(S.linkMode){                                          // 连线模式才有命中层：点线=选中高亮(Delete删)
      const H=document.createElementNS(NS,'line');
      H.setAttribute('x1',ep.x1); H.setAttribute('y1',ep.y1); H.setAttribute('x2',ep.x2); H.setAttribute('y2',ep.y2);
      H.setAttribute('stroke','transparent'); H.setAttribute('stroke-width', isSel?16:11);
      H.setAttribute('pointer-events','stroke'); H.style.cursor='pointer';
      H.addEventListener('mousedown', ev=> ev.stopPropagation());
      H.addEventListener('click', ev=>{ ev.stopPropagation();
        S.selEdge=(S.selEdge===e)? null : e; draw(); renderEdges(); });
      svg.appendChild(H);
    }
    const L=document.createElementNS(NS,'line');
    L.setAttribute('x1',ep.x1); L.setAttribute('y1',ep.y1); L.setAttribute('x2',ep.x2); L.setAttribute('y2',ep.y2);

    // 或 (b)跨线接口(etri=ext)：灰虚线表示"跨线传递"。

    if(isSel){ L.setAttribute('stroke','#FF6F00'); L.setAttribute('stroke-width','4'); }   // 选中高亮（橙）
    else { L.setAttribute('stroke', EDGE_COLOR[e.etri]||'#666');

    L.setAttribute('marker-end','url(#arr)');

function contentExtent(){
  let mx=0,my=0,x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;

    x0=Math.min(x0,e.x-33); x1=Math.max(x1,e.x+33);
    y0=Math.min(y0,e.y-11); y1=Math.max(y1,e.y+11);
    mx=Math.max(mx,e.x+33); my=Math.max(my,e.y+11);
  }

function centerView(){

  const o=grp.map(n=>({x:n.x, y:n.y}));
  drag={id:e.id, group:grp, o:o, dx:sx-(r.left+e.x+S.pan.x), dy:sy-(r.top+e.y+S.pan.y)}; _dragMoved=false;

           return '<div style="display:flex;align-items:center;gap:4px">'
            +'<button class="mini" data-dir="-1" data-i="'+i+'">↑</button>'
            +'<button class="mini" data-dir="1" data-i="'+i+'">↓</button>'

       +'</div>'
       +'<label>添加（未被他CP绑定）</label><div id="pcpsel">'
       +(lts.length?lts.map(x=>'<label class="cpchk" style="font-weight:400;display:flex;align-items:center;gap:4px">'
         +'<input type="checkbox" style="width:auto" value="'+x.id+'" '+((chk.indexOf(x.id)>=0)?'checked':'')+'>'
         +'<span style="overflow:hidden;white-space:nowrap">'+x.id+'</span></label>').join('')
         :'<div class="hint">没有可用 LT（或全部已被绑定）</div>')+'</div>';
    const dir=(e.attrs&&e.attrs.dir)||'down';
    html+='<label>传送方向</label><select id="pdir"><option '+(dir==='down'?'selected':'')+' value="down">上→下</option>'
       +'<option '+(dir==='up'?'selected':'')+' value="up">下→上</option></select>'

    $('ppartner').onchange=v=>{ e.attrs=(e.attrs||{}); const s=v.target.value.trim();

    const a=e.attrs=(e.attrs||{});
    if($('pdec_db'))  $('pdec_db').onchange=v=>{ a.db=v.target.value.trim()||''; draw(); };
    if($('pdec_dev')) $('pdec_dev').onchange=v=>{ a.device=v.target.value.trim()||''; draw(); };
    const mapBox=$('pdecmap');
    if(mapBox) mapBox.querySelectorAll('[data-decdest]').forEach(inp=>{
      inp.onchange=v=>{ const d=+inp.getAttribute('data-decdest'); const to=v.target.value.trim();
        a.dest_map=(a.dest_map||[]);

        draw(); }; });
    if($('pdecDel')) $('pdecDel').onclick=()=>{ const mb=$('pdecmap'); if(!mb)return;
      const c=+(mb.getAttribute('data-n')||0); if(c>1){ a.dest_map=(a.dest_map||[]).filter(r=>+r.dest<=c-1);
        mb.setAttribute('data-n',c-1); select(e.id); } };      // 减行: 一并丢弃被删道号
    if($('pdecAdd')) $('pdecAdd').onclick=()=>{ const mb=$('pdecmap'); if(!mb)return;
      const c=+(mb.getAttribute('data-n')||0); if(c<12){ mb.setAttribute('data-n',c+1); select(e.id); } };   // 加行: 重建(保留已填)
  }
  if(e.kind!=='DEC'){
    if($('pattrs')) $('pattrs').onchange=v=>{ try{e.attrs=JSON.parse(v.target.value); draw(); select(e.id);}catch(_){ e.attrs=e.attrs||{}; } };
  }
  // tag 覆盖表单：勾选展开字段；各字段空则从 e.tag 删除(留自动推导)。未勾选=全自动
  const tagWrite=(ev,key)=>{ e.tag=e.tag||{};

  const tagManual=$('ptagmanual'), tFields=$('ptagfields');
  if(tagManual){
    tagManual.onchange=v=>{ tFields.style.display=v.target.checked?'block':'none';
      if(!v.target.checked){ delete e.tag.x1; delete e.tag.x2; delete e.tag.mid; delete e.tag.branch; }

    if($('ptagx1'))  $('ptagx1')  .onchange=v=>tagWrite(v,'x1');
    if($('ptagx2'))  $('ptagx2')  .onchange=v=>tagWrite(v,'x2');
    if($('ptagmid')) $('ptagmid') .onchange=v=>tagWrite(v,'mid');
    if($('ptagbranch')) $('ptagbranch').onchange=v=>tagWrite(v,'branch');
  }
  $('pcommit').onclick=()=> commitPanel(e);
  $('pdel').onclick=()=>{ S.edges=S.edges.filter(ed=>ed.from!==e.id&&ed.to!==e.id);
    S.elements=S.elements.filter(x=>x.id!==e.id); S.selId=null; panel.style.display='none'; draw(); renderEdges(); };
  draw();
}

// ---------- spec 生成 / 导入 ----------
function buildSpec(){
  return {line:S.line||'Line_5', comment:'由 layout_editor 生成',
    elements:S.elements.map(e=>({id:e.id,kind:e.kind,type:(e.kind==='RB'?'roller':e.kind.toLowerCase()),
      label:e.label,pos:{x:Math.round(e.x),y:Math.round(e.y)},attrs:e.attrs||{},tag:e.tag||{}})),
    edges:S.edges.map(e=>({from:e.from,to:e.to,etri:e.etri}))};
}
function loadSpec(spec){
  S.line=spec.line||S.line; $('lineid').value=S.line;
  const els0=spec.elements||[];
  // 迁移：旧版 TT 拆成 .1/.2/.3 多节点 → 归并为单基节点(单中心)，转角位并进 attrs.angles
  const tmap={}; const keep=[];
  for(const e of els0){
    if(e.kind==='TT'){
      const b=devBase(e.id);
      if(!b){ keep.push(e); continue; }                                  // 已是单基(无 .N)
      if(!tmap[b]) tmap[b]={id:b,kind:'TT',pos:{x:e.pos?e.pos.x:0,y:e.pos?e.pos.y:0},attrs:Object.assign({},e.attrs||{}),tag:{}};
      const a=(e.attrs&&e.attrs.angles)||(e.attrs&&e.attrs.turn?[e.attrs.turn]:[])||[];
      if(a.length) tmap[b].attrs.angles=(tmap[b].attrs.angles||[]).concat(a);
    } else keep.push(e);
  }
  for(const b in tmap) keep.push(tmap[b]);
  // 边：指向 TT.N 的改为指向其基节点
  const baseSet=new Set(Object.keys(tmap));
  const rebase=i=>{ const b=devBase(i); return (b&&baseSet.has(b))?b:i; };
  S.elements=keep.map(e=>({id:e.id,kind:e.kind,label:e.label||'',x:e.pos?e.pos.x:0,y:e.pos?e.pos.y:0,attrs:e.attrs||{},tag:e.tag||{}}));
  S.edges=(spec.edges||[]).map(ed=>({from:rebase(ed.from),to:rebase(ed.to),etri:ed.etri||'roller'}));
  S.selEdge=null;
  centerView();                                             // 切换线路自动居中内容
  select(null); draw(); renderEdges();
}

// 客户端校验（与 graph.py validate() 对齐）：导出前发现问题→点条目跳到布局定位修改
function validateNow(spec){
  const issues=[];
  if(!spec||!spec.elements) return [{id:'',msg:'该线无内容'}];
  const line=spec.line; if(!line) issues.push({id:'',msg:'缺 line（输送编号）'});
  const els=spec.elements, ids={};
  const plex = id => /(RB|LT)$/.test(id) ? id.slice(0,-2)+(id.endsWith('RB')?'LT':'RB') : null;  // 同编号绑定对:LT工位滚床 tag 即 LT,LT↔RB 同一物理工位
  for(const e of els){
    if(!e.id){ issues.push({id:'',msg:'存在缺 id 的元素'}); continue; }
    if(ids[e.id]) issues.push({id:e.id,msg:'id 重复: '+e.id});
    ids[e.id]=1;
    if(line && !e.id.startsWith(line+'_')) issues.push({id:e.id,msg:'未以线前缀 '+line+'_ 开头'});
    if(!['RB','LT','TT','SL','HE','CP','TC','EXT','ENT','DEC'].includes(e.kind)) issues.push({id:e.id,msg:'kind 未知: '+(e.kind||'(空)')});
    if(e.kind==='DEC'){
      const dm=(e.attrs||{}).dest_map||[];
      if(!((e.attrs||{}).device||'').trim()) issues.push({id:e.id,msg:'决策点未填挂靠设备 device'});
      const seen={};
      for(const r of dm){ if(seen[r.dest]) issues.push({id:e.id,msg:'决策点 Dest 道号重复: '+r.dest}); seen[r.dest]=1;
        if(r.to && !ids[r.to] && !ids[plex(r.to)]) issues.push({id:e.id,msg:'决策点 Dest 道号'+r.dest+' 的后续滚床不存在: '+r.to}); }
      if(dm.some(r=>r.to && !ids[r.to])) {}   // 已在循环报
    }
    if(e.kind==='LT' && !['RB','WT'].includes(((e.attrs||{}).pair)||'RB')) issues.push({id:e.id,msg:'LT 配位 pair 只能是 RB/WT'});
  }
  const seen=new Set();
  for(const ed of (spec.edges||[])){
    if(!ids[ed.from]) issues.push({id:ed.from||'',msg:'边的起点不存在: '+ed.from});
    if(!ids[ed.to]) issues.push({id:ed.to||'',msg:'边的终点不存在: '+ed.to});
    const k=ed.from+'>'+ed.to;
    if(seen.has(k)) issues.push({id:ed.from||ed.to,msg:'重复边 '+ed.from+'→'+ed.to});
    seen.add(k);
  }
  for(const e of els){
    if(e.kind==='CP') for(const s of ((e.attrs||{}).stops)||[]) if(!ids[s]) issues.push({id:e.id,msg:'CP stops 引用不存在元素: '+s});
    if(ISX(e.kind) && !((e.attrs||{}).partner||'').trim()) issues.push({id:e.id,msg:e.kind+' 未填跨线对端(partner)'});
  }
  return issues;
}
function renderErr(issues){
  const box=$('expErr'); if(!box) return;
  if(!issues.length){ box.innerHTML='<div style="font-size:12px;color:#2e7d32;padding:6px 8px;border:1px solid #2e7d32;border-radius:4px;background:#e8f5e9;margin-bottom:8px">✅ 校验通过，可直接导出</div>'; return; }
  box.innerHTML='<div style="font-size:12px;color:#b71c1c;padding:6px 8px;border:1px solid #b71c1c;border-radius:4px;background:#ffebee;margin-bottom:6px">⚠ 校验发现 <b>'+issues.length+'</b> 个问题，点条目跳到布局修改</div>'
    +issues.map((o,i)=>'<div data-i="'+i+'" style="font-size:12px;padding:2px 4px;cursor:pointer;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'
      +(o.id?'<b>'+o.id+'</b>: ':'')+o.msg+'</div>').join('');
  box.querySelectorAll('[data-i]').forEach(div=>{ const i=+div.getAttribute('data-i');
    div.onmouseenter=()=>div.style.background='#ffd9d9'; div.onmouseleave=()=>div.style.background='transparent';
    div.onclick=()=>{ const o=issues[i]; const en=o.id&&nodeById(o.id);
      if(en){ select(o.id); } else if(o.id){ const ed=S.edges.find(x=>x.from===o.id||x.to===o.id); if(ed) S.selEdge=ed; }
      $('exportwrap').style.display='none'; draw(); renderEdges(); }; });
}

const PROJKEY='layout_editor_projects', SAVEKEY='layout_editor_spec';

function persistProj(){ localStorage.setItem(PROJKEY, JSON.stringify(PROJ)); }

function openLine(ln){ $('lineid').value=ln; S.line=ln; if(PROJ[ln]) loadSpec(PROJ[ln]); else loadSpec(sampleSpec(ln)); refreshProjSel(); }
$('btnSave').onclick=saveNow;

// 启动：多工程投影。旧单槽(layout_editor_spec)迁入 Line_5；否则载入示例
buildPalette();

refreshProjSel();

if(lines.length) openLine(lines[0]); else $('btnSample').onclick();

// ================= S1/S2/S3 三键：导出 spec / 点位生成 / 校验 =================
// 共享目录句柄（File System Access API，Chrome/Edge）。首次授权记忆到 IndexedDB，之后免授权写同一目录。
const FSDIR_DB='layout_editor_fs', FSDIR_STORE='dirs', FSDIR_KEY='exportdir';
let fsDir=null;                                // {name, handle}
function fsOpenDB(){ return new Promise((res,rej)=>{ const rq=indexedDB.open(FSDIR_DB,1);
  rq.onupgradeneeded=()=>{ if(!rq.result.objectStoreNames.contains(FSDIR_STORE)) rq.result.createObjectStore(FSDIR_STORE); };
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error); }); }
async function fsLoadDir(){
  try{ const db=await fsOpenDB(); return new Promise(res=>{ const tx=db.transaction(FSDIR_STORE,'readonly');
    const rq=tx.objectStore(FSDIR_STORE).get(FSDIR_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>res(null); }); }
  catch(_){ return null; }
}
async function fsSaveDir(entry){ try{ const db=await fsOpenDB(); return new Promise(res=>{ const tx=db.transaction(FSDIR_STORE,'readwrite');
    tx.objectStore(FSDIR_STORE).put(entry,FSDIR_KEY); tx.oncomplete=()=>res(true); tx.onerror=()=>res(false); }); }
  catch(_){ return false; } }
async function fsAdopt(entry){                        // 归一同步句柄（跨刷新恢复权限可能降级为 prompt）
  fsSaveDir(entry);
  try{ if((await entry.handle.queryPermission({mode:'readwrite'}))!=='granted'){
    await entry.handle.requestPermission({mode:'readwrite'}); } }catch(_){}
  fsDir=entry; return fsDir;
}
async function fsPickDir(title){                      // 首次/重选文件夹：弹系统选择器 → 记忆
  if(!window.showDirectoryPicker) return null;
  const h=await window.showDirectoryPicker({mode:'readwrite'});
  return fsAdopt({name:h.name, handle:h});
}
async function fsEnsureDir(){                         // 会话内有句柄且已授权直接用；否则先记忆恢复、再弹一次
  if(fsDir){ try{ if((await fsDir.handle.queryPermission({mode:'readwrite'}))==='granted') return fsDir; }catch(_){} }
  const saved=await fsLoadDir();
  if(saved){ try{ if((await saved.handle.queryPermission({mode:'readwrite'}))==='granted'){ fsDir=saved; return fsDir; } }catch(_){} }
  return await fsPickDir();
}
async function fsWrite(relPath, content){             // relPath 含子目录则自动创建。返回 {ok,name,err}
  const root=await fsEnsureDir(); if(!root) return {ok:false,err:'denied'};
  const parts=relPath.split('/');
  let h=root.handle;
  try{
    for(let i=0;i<parts.length-1;i++) h=await h.getDirectoryHandle(parts[i],{create:true});
    const f=await h.getFileHandle(parts[parts.length-1],{create:true});
    const w=await f.createWritable(); await w.write(content); await w.close();
    return {ok:true, name:root.name+'/'+relPath};
  }catch(e){ return {ok:false, err:String(e&&e.message||e)}; }
}
function fsPickButton(btn, cb){                       // 三键统一入口：支持自动/手动重选目录
  if(!window.showDirectoryPicker){ alert('当前浏览器不支持直接写文件夹。请用 Chrome/Edge；或改用「导出弹窗(多线)」下载 spec。'); return; }
  cb();
}

// ---- JS 版 tags 推导（与 tags.py 对齐：读 element.tag 覆盖，缺省按 kind 推导）----
const JS_TAG_NS='.', JS_PLC='L3', JS_BRANCH='IL';
const JS_TAG_KINDS=['RB','WT','LT','TT','SL','HE','TC'];
const JS_PT_BODY='M1003_BodyID', JS_PT_SKID='I1030_RBDataSkidNo', JS_PT_TGT='I1031_RBDataTarget';
function jseg(dev){ const m=/^(\d*[A-Z]+)\d+/.exec(dev||''); return m?m[1]:'1D'; }
function jdevTokens(full){ const tail=(full.split('.')[0]).split('_').pop();
  const m=/^(\d*[A-Z]+\d+)([A-Z]+)/.exec(tail);
  return { seg:jseg(tail), pos:m?m[1]:tail, suf:m?m[2]:'' }; }
function jx1x2(el){
  const tag=el.tag||{}, rid=el.id, seg=jdevTokens(rid), kind=el.kind;
  let x1,x2;
  if(tag.x1){ x1=String(tag.x1); x2=String(tag.x2||tag.x1); }
  else if(kind==='RB'){ x1=x2=seg.pos+'RB'; }
  else if(kind==='LT'){ x1=x2=seg.pos+'LT'; }
  else if(kind==='WT'){ x1=x2=seg.pos+'WT'; }
  else { x1=seg.pos+kind; x2=seg.pos+'RB'; }
  let branch=String(tag.branch||JS_BRANCH).replace(/^\.+|\.+$/g,'')||JS_BRANCH;
  const mid=tag.mid||null, devArea=seg.seg;
  return { x1,x2,branch,mid,devArea };
}
function jtagPath(line,x1,x2,branch,mid,devArea,point){
  const midPart=mid?'_'+mid:'';
  return JS_TAG_NS+JS_PLC+line+'_'+devArea+midPart+'_'+x1+'_'+x2+'.'+branch+'.SD.'+point;
}
function jderive(el,line){ if(!JS_TAG_KINDS.includes(el.kind)) return null;
  const {x1,x2,branch,mid,devArea}=jx1x2(el), short=lineIdOf(el.id);
  return { node:el.id, device:x1, device_rb:x2,
    body:jtagPath(short,x1,x2,branch,mid,devArea,JS_PT_BODY),
    skid:jtagPath(short,x1,x2,branch,mid,devArea,JS_PT_SKID),
    tgt: jtagPath(short,x1,x2,branch,mid,devArea,JS_PT_TGT) };
}
function jBuild(spec){ const rows=(spec.elements||[]).map(e=>jderive(e,spec.line)).filter(Boolean);
  const rollers=rows.map(d=>({node:d.node,device:d.device,device_rb:d.device_rb,type:null,mid:null,branch:null}));
  const points=rows.map(d=>({node:d.node,tag:d.tgt,kind:'target'}));
  return { rows, rollers, points }; }

// ---- S1 导出 spec（当前线 → 专属目录）----
let pbar;
function pending(msg){ pbar=$('fsStatus')||(function(){ const d=document.createElement('div');
  d.id='fsStatus'; d.style.cssText='position:fixed;left:50%;top:46%;transform:translate(-50%,-50%);background:rgba(38,50,56,.95);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.3)';
  document.body.appendChild(d); return d; })(); pbar.textContent=msg; }
function done(p){ if(p){ p.remove(); } }
$('btnS1').onclick=()=> fsPickButton('S1', async ()=>{
  const ln=curLine(); const s=buildSpec();
  pending('S1 导出 spec → 专属目录…'); if(!window.showDirectoryPicker) return;
  const r=await fsWrite(ln+'.json', JSON.stringify(s,null,2));
  setTimeout(()=>done(pbar),1500);
  if(r.ok) alert('✅ 已导出 '+ln+'.json → '+r.name);
  else if(r.err==='denied') alert('已取消（未选文件夹）');
  else alert('导出失败：'+r.err);
});
// ---- S2 点位生成（当前线 → deviceConfig\线.json + 线_tags.txt）----
function tagsConfig(line,rows,rollers,points){ return { plc:JS_PLC+line,
  _comment:'布局编辑器 S2 生成。rollers: 推导参数, 加载时重拼 车身(M1003_BodyID)+雪橇(I1030_RBDataSkidNo); device=X1 设备体, device_rb=X2 该位滚床; points: target 目标地址等。',
  rollers, points }; }
function tagsTxt(line,rows){ let t='#'+line+' tag 订阅点\n';
  for(const d of rows){ t+=String(d.node).padEnd(22)+' X1='+String(d.device).padEnd(8)+' X2='+String(d.device_rb).padEnd(8)+'\n'
    +'    body   '+d.body+'\n' +'    skid   '+d.skid+'\n' +'    target '+d.tgt+'\n'; }
  return t; }
$('btnS2').onclick=()=> fsPickButton('S2', async ()=>{
  const ln=curLine(); const spec=buildSpec(); const {rows,rollers,points}=jBuild(spec);
  pending('S2 生成点位 → 专属目录…'); if(!window.showDirectoryPicker) return;
  const r1=await fsWrite('deviceConfig/'+ln+'.json', JSON.stringify(tagsConfig(ln,rows,rollers,points),null,2));
  const r2=await fsWrite('deviceConfig/'+ln+'_tags.txt', tagsTxt(ln,rows));
  setTimeout(()=>done(pbar),1500);
  if(r1.ok&&r2.ok) alert('✅ '+ln+'：'+rows.length+' 台可停设备 → '+r1.name+' 及 _tags.txt');
  else if(r1.err==='denied') alert('已取消（未选文件夹）');
  else alert('部分导出失败：'+r1.err+' / '+r2.err);
});
// ---- S3 校验当前线：id/边/CP/partner（对齐 graph.py validate）----
$('btnS3').onclick=()=>{
  const issues=validateNow(buildSpec());
  if(!issues.length){ alert('✅ 校验通过。id 唯一、边端点存在、CP 引用有效、partner 已填。'); return; }
  const first=()=>alert('⚠ 校验发现 '+issues.length+' 个问题：\n\n'+issues.slice(0,12).map(o=>'· '+o.id+' — '+o.msg).join('\n')+'\n\n点确定后在面板内逐项定位。');
  first(); const box=($('expErr')); if(box){ $('exportwrap').style.display='flex'; refreshExport(); renderErr(issues); }
};
